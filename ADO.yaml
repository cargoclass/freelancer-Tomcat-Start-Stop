---
trigger:
  - none
stages:
  - stage: Stage_TomcatStop
    variables:
      tomcatpath: $(Dev-Tomcat-Path)
    jobs:
      - deployment: Tomcat_Stop
        environment:
          name: Test-New
          resourceType: VirtualMachine
          tags: Dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Killing Tomcat service..."
                    PID=$(pgrep -f "/home/test/tomcat")
                    echo $PID
                    if [ -n "$PID" ]; then
                      echo $PID
                      sudo su - test <<HERE
                      kill -9 $PID
                      whoami
                      HERE
                      echo "Tomcat service has been killed."
                    else
                      echo "Tomcat service is not running."
                    fi
      - job: manual_approval
        dependsOn: Tomcat_Stop
        displayName: Manual Approval
        pool: server
        timeoutInMinutes: 4320
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 360
            inputs:
              notifyUsers: |
              instructions: Hi, Please Validate before going to start tomcat service
              onTimeout: reject
  - stage: Stage_TomcatStart
    variables:
      tomcatpath: $(Dev-Tomcat-Path)
    jobs:
      - deployment: Tomcat_Start
        environment:
          name: Test-New
          resourceType: VirtualMachine
          tags: Dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Starting Tomcat..."
                    echo $(tomcatpath)
                    cat $(tomcatpath)/bin/startup.sh
                    whoami
                    sudo su - test <<HERE
                    $(tomcatpath)/bin/startup.sh
                    whoami
                    HERE